    <meta name="color-scheme" content="light dark" />

    <!-- Ferramenta pessoal, não conteúdo para busca: nada aqui deve aparecer em
         resultado de pesquisa. O repositório de origem é privado, e indexar o
         build desfaria metade da razão de ele ser privado. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- O tema é aplicado antes da primeira pintura para não haver piscada de
         branco em quem usa escuro. O `next-themes` faz isso em runtime, mas só
         depois do JS carregar — e no Pages isso demora o suficiente para ver. -->
    <script>
      try {
        const salvo = localStorage.getItem('theme')
        const escuro =
          salvo === 'dark' ||
          ((!salvo || salvo === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (escuro) document.documentElement.classList.add('dark')
      } catch {}
    </script>
